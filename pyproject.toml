[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra-rl-gym"
version = "0.1.0"
description = "AstraGym worlds, AstraRL/AstraTune train center, and astra_plugin use-case contract"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }

[project.optional-dependencies]
sb3 = ["stable-baselines3", "gymnasium"]
# MLX stack is installed in the Mini finetune-env; not a hard pip dep here.

[tool.setuptools.packages.find]
# ``envs`` is the Gymnasium AgentToolGym / register surface used by astragym
# agent_* makers and product agrpo facades (pip-only; no vendored gym in the product tree).
include = ["astragym*", "astrarl*", "astratune*", "astra_plugin*", "envs*"]
exclude = ["backend*", "frontend*", "tests*", "recipes*", "docs*", "data*"]
