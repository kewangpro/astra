name: ensemble_sft_specialist_ds_v1
version: "1.0.0"
created_at: "2026-10-21"
task_type: sft
domain: NLP
description: >
  Phase 5 Data Scientist specialist SFT: gemma-3-4b-it-4bit on tool-call
