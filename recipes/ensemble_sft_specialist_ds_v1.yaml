  HARVEST (2026-10-21): mission 5f4912b5 → eval_loss 0.16;
  adapters/astra_5f4912b5_iter0/best (= adapters/specialist_ds_v1).

hyperparameters:
  base_model: mlx-community/gemma-3-4b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  dataset_path: data_ft/specialists/data_scientist

  # Cold start — no adapter warm-start
  adapter: ""

  num_layers: 8
  lora_rank: 16
  lora_scale: 20.0
