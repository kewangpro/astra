name: ensemble_sft_dpo_grpo_v1
version: "1.0.0"
created_at: "2026-09-14"
task_type: grpo
domain: NLP
description: >
  GRPO (Group Relative Policy Optimization) fine-tuning for the Ensemble routing model
  chained from the Stage 2 DPO champion adapter (adapters/astra_4604539c_iter0/best).
  Runs on Mac Mini via MLX on Apple Silicon GPU.

hyperparameters:
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  adapter: adapters/astra_4604539c_iter0/best
  prompt_template: backend/prompts/conductor_min.md
  num_layers: 4
  lora_rank: 8
  lora_scale: 5.0
  lora_dropout: 0.1
  iters: 100
  num_generations: 2
  temp: 1.2
  max_tokens: 96
  eval_max_tokens: 256
  reward_schema: v1
  email_weight: 0
  focus_weight: 10
  max_zero_steps: 3
  max_one_steps: 3
  learning_rate: 0.000001
  clip_epsilon: 0.1
  max_grad_norm: 1.0
  steps_per_report: 1
  steps_per_eval: 25
  save_every: 25
  routing_only: true

metric_ceiling:
  pass_rate: 0.91

target_metric:
  pass_rate: 0.75
