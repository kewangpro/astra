name: ensemble_sft_1b_v5
version: "1.0.0"
created_at: "2026-10-21"
task_type: sft
domain: NLP
description: >
  Phase 2a cascade planner: warm-start gemma-3-1b-it-4bit from retrain_1b_v4
  on the current conductor_min data_ft set (~409 train examples). Matches the
  historical configs_1b_v4 LoRA shape (all layers, rank 16, scale 20, lr 1e-5).
  Goal is toward ~80–85% bare / full-eval routing for 1B fast-path; see
  ensemble/docs/FINETUNE.md Method A / Future Direction 2a.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  dataset_path: data_ft

  # Warm-start inventory adapter (not under best/)
  adapter: adapters/retrain_1b_v4

  # Match configs_1b_v4.yaml
  num_layers: -1
  lora_rank: 16
  lora_scale: 20.0
  lora_dropout: 0.0
  batch_size: 1
  learning_rate: 0.00001
  iters: 200
  save_every: 50
  steps_per_eval: 50
  steps_per_report: 10
  val_split: 0.1
  val_batches: 25
  max_seq_length: 2560
  preserve_reasoning: true
  mask_prompt: true

target_metric:
  # Lower-is-better; one astra iteration runs the full mlx iters above.
  eval_loss: 0.45
