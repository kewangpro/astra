name: ensemble_sft_v1
version: "1.0.0"
created_at: "2026-09-12"
task_type: sft
learner_id: mlx_sft
domain: NLP
description: >
  Supervised Fine-Tuning for Ensemble routing via AstraTune. Platform owns
  LoRA I/O + SFT math; Ensemble sft_train.py is a thin CLI over gold JSONL.
  Missions dispatch astratune.make("mlx_sft", use_execv=True).learn() on the
  Mac Mini (~/finetune + ~/finetune-env).

hyperparameters:
  # --- platform (AstraTune facade → sft_train.py) ---
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  dataset_path: data_routing
  num_layers: 4
  lora_rank: 8
  lora_scale: 5.0
  lora_dropout: 0.1
  batch_size: 2
  learning_rate: 0.0002
  iters: 150
  save_every: 50
  steps_per_eval: 25
  steps_per_report: 5
  val_split: 0.1
  max_seq_length: 2048
  preserve_reasoning: true

target_metric:
  eval_loss: 0.8
