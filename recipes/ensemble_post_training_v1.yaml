name: ensemble_post_training_v1
version: "1.0.0"
created_at: "2026-09-15"
task_type: post-training
domain: NLP
description: >
  Autonomous 3-stage sequential post-training (SFT -> DPO -> GRPO) for the Ensemble conductor routing model.
  Executes within a single mission record with stage-specific milestone targets and a terminal 80% pass_rate goal.
  Stage 1 trains routing SFT from the base model, Stage 2 chains into preference-pair DPO, and Stage 3 refines via on-policy GRPO.

target_metric:
  pass_rate: 0.80

metric_ceiling:
  pass_rate: 0.91

stages:
  - stage: 1
    task: sft
    recipe: ensemble_sft_v1
    name: "Routing SFT"
    description: "Supervised fine-tuning on conductor routing traces"
    target_metric:
      eval_loss: 0.80
    hyperparameters:
      base_model: mlx-community/gemma-3-12b-it-4bit
      finetune_dir: /Users/kewang/finetune
      python_bin: /Users/kewang/finetune-env/bin/python
      dataset_path: data_routing
      num_layers: 4
      lora_rank: 8
      lora_scale: 5.0
      lora_dropout: 0.1
      batch_size: 2
      learning_rate: 0.0002
      iters: 150
      save_every: 50
      steps_per_eval: 25
      steps_per_report: 5
      val_split: 0.1
      max_seq_length: 2048
      preserve_reasoning: true

  - stage: 2
    task: dpo
    recipe: ensemble_sft_dpo_v1
    name: "Chained Routing DPO"
    description: "Direct Preference Optimization warm-started from Stage 1 SFT adapter"
    target_metric:
      pass_rate: 0.70
    hyperparameters:
      base_model: mlx-community/gemma-3-12b-it-4bit
      finetune_dir: /Users/kewang/finetune
      python_bin: /Users/kewang/finetune-env/bin/python
      prompt_template: backend/prompts/conductor_min.md
      num_layers: 4
      lora_rank: 8
      lora_scale: 5.0
      lora_dropout: 0.1
      k_collect: 8
      temp: 1.2
      max_tokens: 96
      email_weight: 1
      routing_only: true
      val_split: 0.15
      epochs: 2
      learning_rate: 0.000005
      steps_per_eval: 15

  - stage: 3
    task: grpo
    recipe: ensemble_sft_dpo_grpo_v1
    name: "Chained Routing GRPO"
    description: "Group Relative Policy Optimization warm-started from Stage 2 DPO adapter"
    target_metric:
      pass_rate: 0.80
    hyperparameters:
      base_model: mlx-community/gemma-3-12b-it-4bit
      finetune_dir: /Users/kewang/finetune
      python_bin: /Users/kewang/finetune-env/bin/python
      prompt_template: backend/prompts/conductor_min.md
      num_layers: 4
      lora_rank: 8
      lora_scale: 5.0
      lora_dropout: 0.1
      iters: 100
      num_generations: 2
      temp: 1.2
      max_tokens: 96
      eval_max_tokens: 256
      reward_schema: v1
      email_weight: 0
      focus_weight: 10
      max_zero_steps: 3
      max_one_steps: 3
      learning_rate: 0.000001
      clip_epsilon: 0.1
      max_grad_norm: 1.0
      steps_per_report: 1
      steps_per_eval: 25
      save_every: 25
      routing_only: true
