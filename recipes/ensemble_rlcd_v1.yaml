name: ensemble_rlcd_v1
version: "1.1.0"
created_at: "2026-10-23"
updated_at: "2026-10-27"
task_type: rlcd
domain: NLP
description: >
  RLCD (arXiv:2609.38850) for the Ensemble routing decision. Sample M
  rationales, read the distribution over the closed skill set after "Answer:",
  and score it with the Brier score. Stage 1 trains that readout (pathwise
  only). Stage 2 reinforces the rationale with the same score, c=0.3, KL
  β=0.04 to the stage-1 weights. Pass rate is readout argmax accuracy, not
  bare_eval's JSON-plan score. best/ is the lowest Brier checkpoint.
  Cold-start gemma-3-1b. Paper uses 400 steps × 8 questions; this is 100
  steps × 1 question per stage so a mission can finish on the Mini.

  NOTE (v1.1): lora_scale reduced from 20.0 → 4.0 and num_layers capped at 8.
  The original scale=20.0 / num_layers=-1 caused the LoRA weights to overwrite
  the base model's chat-template generation capability entirely, yielding 0/54
  on bare_eval despite correct readout accuracy (0.932). At scale=4.0 the
  calibrated Answer: distribution is preserved while JSON plan generation
  remains functional. Verified: mission 183841eb collapsed to <end_of_turn>
  repetition loops on all 54 bare_eval cases.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/conductor_min.md

  # Cold start — stage 2's anchor is the in-process stage-1 endpoint.
  no_adapter: true
  adapter: ""

  stage: both
  score: brier
  num_generations: 4
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  sf_coef: 0.3
  kl_beta: 0.04

  # lora_scale reduced from 20.0 → 4.0: scale=20.0 with all layers caused
  # <end_of_turn> collapse on bare_eval (0/54). scale=4.0 keeps the Brier
  # calibration signal without overwriting the generation capability.
  # num_layers capped at 8 (from -1/all) for the same reason — the readout
  # gradient only needs to reach the skill-token log-prob layers; fine-tuning
  # all layers at high scale destroys the chat template.
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0

  iters: 100
  learning_rate: 0.000002
  max_grad_norm: 1.0
  steps_per_eval: 25
  steps_per_report: 1
  save_every: 25
  max_seq_len: 4096
  routing_only: true

target_metric:
  pass_rate: 0.5

metric_ceiling:
  pass_rate: 1.0
