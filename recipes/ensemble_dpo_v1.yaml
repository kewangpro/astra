name: ensemble_dpo_v1
version: "1.0.0"
created_at: "2026-07-03"
task_type: dpo
domain: NLP
description: >
  DPO (Direct Preference Optimization) fine-tuning for the Ensemble routing
  model. Wraps the existing ensemble/finetune/dpo_train.py script rather than
  reimplementing the training loop — astra only orchestrates dispatch,
  telemetry, and pivoting. Runs on the Mac Mini, where ~/finetune holds the
  script + adapters and ~/finetune-env has mlx_lm installed.

hyperparameters:
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune          # remote host path to ensemble/finetune checkout
  python_bin: /Users/kewang/finetune-env/bin/python
  adapter: adapters/grpo_v9_min/best            # warm-start + frozen reference policy
  prompt_template: backend/prompts/conductor_min.md
  # LoRA (must match warm-start adapter's config)
  num_layers: 8
  lora_rank: 8
  lora_scale: 20.0
  lora_dropout: 0.0
  # Phase 1 — pair collection
  k_collect: 8
  temp: 1.2
  max_tokens: 96
  email_weight: 1
  routing_only: true
  # Phase 3 — training
  #
  # learning_rate/epochs/steps_per_eval retuned 2026-08-02 after a manual offline
  # diagnostic (outside the mission loop, reusing the same collected pairs for a
  # clean comparison) tested three rates against 150+ iterations of the mission
  # being stuck at 0.75-0.82 despite the search-lever fix in Phase 35:
  #   - 5e-7 (this recipe's prior value): loss barely moves epoch to epoch
  #     (~0.693 -> ~0.676 avg over a FULL 3-epoch run) regardless of what pairs
  #     were collected -- confirmed via 15+ iterations' worth of near-identical
  #     per-epoch loss. Too weak to produce any differentiated learning signal.
  #   - 5e-6 (10x): catastrophic collapse to 0% pass rate by step ~56, wildly
  #     unstable per-step loss (0.008 <-> 1.53) -- the same failure signature as
  #     the original learning_rate incident that made this recipe locked in the
  #     first place (see Phase 26). Confirms the lockout is necessary, not
  #     over-cautious.
  #   - 2e-6 (4x, the value below): peaked at 81.8% (tying the mission's
  #     all-time best) at step 25 of a 192-step/3-epoch run, then steadily
  #     overfit down to 43.9% by the final step -- clean overfitting, not
  #     instability. dpo_train.py already tracks and saves a separate "best"
  #     checkpoint whenever eval improves (independent of the final-epoch
  #     adapter), which is what the mission's own pass_rate score already reads
  #     -- so the fix is to stop training near the peak instead of running
  #     through it, not to add new best-checkpoint-tracking logic.
  # epochs cut 3 -> 1 (peak was well within epoch 1, ~64 steps) and
  # steps_per_eval tightened 50 -> 15 so the best-checkpoint tracker samples
  # finely enough within that one epoch to actually catch the peak rather than
  # missing it between coarse checkpoints.
  #
  # 2026-09-02: the entire 2026-08-02 lr diagnostic above was run under the OLD
  # mean-token-log-prob dpo_loss, now replaced by the summed sequence
  # log-likelihood (ensemble 7b9f45a). The gradient is ~completion-length larger
  # (~40-80x) at the same lr, so those three data points ("5e-7 too weak",
  # "2e-6 overfits", "5e-6 collapses") no longer transfer. Per the ensemble
  # guidance, lr dropped 2e-6 -> 3e-7 as the starting point for a fresh offline
  # re-tune. max_grad_norm stays 1.0 and is now load-bearing (with the large
  # summed gradient the clip almost always binds, so lr ~= the per-step size).
  #
  # 2026-09-03: offline 3x3 beta/lr sweep (beta {0.1,0.3,0.5} x lr {3e-7,1e-6,
  # 3e-6}, --load-pairs on 9e7cc2df's 69 pairs, epochs=1, 71-case static eval,
  # warm=grpo_v9_min/best @ 85.9%). best-during-training -> final per config:
  #   0.1: 3e-7 85.9->83.1 | 1e-6 84.5->81.7 | 3e-6 83.1->7.0
  #   0.3: 3e-7 85.9->85.9 | 1e-6 87.3->78.9 | 3e-6 84.5->63.4
  #   0.5: 3e-7 87.3->83.1 | 1e-6 85.9->77.5 | 3e-6 76.1->59.2
  # Conclusions: (1) NOTHING held a gain to end-of-training — best final is
  # 85.9% (= warm-start). (2) The peak ever seen is 87.3% (62/71, +1 case), a
  # transient mid-training spike, non-reproducible (dpo_train shuffles unseeded).
  # (3) lr 3e-6 collapses at every beta; 3e-7 is the only stable lr; beta barely
  # matters. DPO does not improve this converged checkpoint — hyperparameters
  # are exhausted. The remaining routing gains need targeted SFT / prompt work
  # (the 9 cases failing on warm-start AND every sweep config: 3 shell,
  # route_aws_cost_visualize_regression, route_meta_mcp_servers,
  # route_tier_awareness_core_skill_available, route_mission_queued_status,
  # 2 starved-class), not DPO tuning. Keeping beta 0.1 / lr 3e-7 as the least
  # harmful config; a DPO mission here will at best tie the warm-start.
  epochs: 1
  beta: 0.1
  learning_rate: 0.0000003      # 3e-7 — only stable lr under the summed-log-prob loss (2026-09-03 sweep)
  max_grad_norm: 1.0
  steps_per_eval: 15
  eval_max_tokens: 256

# Empirically-observed ceiling for this recipe + gemma-3-12b-it-4bit + the
# routing eval set. Missions whose target_metric exceeds this (beyond a small
# noise margin) are rejected at creation — see backend/routers/missions.py.
#   - mission 43517dd5 (target pass_rate 0.80): completed at 0.833 on the first
#     evaluated iteration.
#   - mission ce2828f4 (target pass_rate 0.85): 700+ iterations / 20 days, best
#     0.833 (iters 98/134/710), never beaten. The routing model is already
#     converged; one epoch of DPO from the 0.833 warm-start only overfits (peak
#     ~0.82 at step 25 → collapse to ~0.44), and the dpo/grpo pivot safelist
#     can't touch the levers that would matter. Raise this only with fresh
#     evidence that the ceiling has genuinely moved.
#   - 2026-09-02: dpo_train.py / grpo_train.py now exclude the 7 dynamic MCP
#     routing cases (expected_skill = "mcp:Server:tool") from the fine-tune
#     pass-rate. Those skill strings are absent from the training prompt, so
#     every rollout failed identically — they contributed no preference signal
#     and dragged the ceiling down by ~0.10 (7/66). The reported "Pass rate"
#     lines telemetry parses are now over the 71-case static-skill routing set
#     (12 teacher-verified cases were also added for starved skill classes —
#     ensemble d0ab1db).
#   - 2026-09-02 (cont.): on the corrected 71-case set the warm-start adapter
#     grpo_v9_min/best scores 0.859 (61/71) *before any DPO* — the old 0.833
#     "ceiling" was mostly the MCP artifact. Ceiling set to 0.87: just above the
#     0.859 warm-start, leaving room for the new starved-class cases
#     (route_report_*, route_calendar_*) that now have collected preference
#     pairs, while still rejecting the fantasy targets. Note the warm-start IS
#     the empirically-observed best so far — DPO has regressed grpo_v9_min/best
#     on every evaluated iteration across 4 missions (8697c56b best 0.818 @
#     iter8 = −0.04; 6320953e iter0 raw 0.775 = −0.08). A brief 0.90 target
#     (2026-09-02) was set and reverted — it only guarantees a STALL.
#   - 2026-09-02 (loss fix, ensemble 7b9f45a, deployed to mac-mini): dpo_train.py's
#     dpo_loss switched from mean-token log-prob to the SUMMED sequence
#     log-likelihood (_seq_log_prob_sum). The mean divided the chosen−rejected
#     margin by completion length (~40–80×), leaving a near-zero gradient at
#     β≈0.1 — the mechanical reason every prior DPO run regressed the warm-start.
#     With the sum the gradient is ~length× larger, so learning_rate dropped
#     2e-6 → 3e-7 (see the Phase 3 block above); the first mission under this
#     loss is a re-tune, not a production run.
#   - STILL OPEN (coordinated ensemble + astra): no held-out split. Pairs are
#     collected from all 71 static cases and best/ is selected by
#     run_routing_eval on those same 71 — pure overfit-to-metric. The fix is a
#     train/test split whose TEST-set pass-rate becomes the mission metric
#     astra's telemetry parses. Until then a DPO best/ checkpoint should not be
#     trusted, and 0.87 here is a placeholder, not a validated ceiling.
metric_ceiling:
  pass_rate: 0.87

# No astra-managed dataset — dpo_train.py's oracle is a hardcoded constant
# (backend/core/eval_cases.yaml, relative to finetune_dir), not a CLI-configurable
# parameter. Post-training goal-metric evaluation should use finetune/bare_eval.py
# --adapter <checkpoint_dir>/best, the actual adapter-discriminating eval tool
# (run_eval.py is saturated and doesn't distinguish between adapters) — NOT YET
# wired into astra's evaluator; currently only the training script's own live
# "Pass rate" lines are tracked via telemetry.
