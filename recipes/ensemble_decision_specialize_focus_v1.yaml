name: ensemble_decision_specialize_focus_v1
version: "1.5.0"
created_at: "2026-11-03"
updated_at: "2026-11-04"
task_type: rlcd
domain: NLP
description: >
  Choice-focus v5: warm-start c8b2644c (best decision_prompt routing 46/74).
  Cases: specialize_choice_focus_v5.jsonl — inject closed routing eval_cases
  as Choice gold + GC/MA/Calendar/Research upweight to fight Research sink.
  Empty-rationale stage 1. Do not promote to :8082 until routing A/B ≥ bf94.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/decision.md
  no_adapter: false
  # bf94→decision_prompt v4 best (held-out 0.818; routing A/B 46/74).
  adapter: adapters/astra_c8b2644c_iter0/best
  cases: data/decision/ensemble/specialize_choice_focus_v5.jsonl
  routing_only: false
  stage: "1"
  empty_rationale: true
  score: brier
  num_generations: 1
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  eval_max_cases: 250
  sf_coef: 0.3
  kl_beta: 0.04
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0
  iters: 180
  learning_rate: 0.0000015
  max_grad_norm: 1.0
  steps_per_eval: 25
  steps_per_report: 1
  save_every: 25
  max_seq_len: 4096

target_metric:
  # Soft held-out; real gate is routing A/B vs bf94 under decision_prompt.
  pass_rate: 0.85

metric_ceiling:
  pass_rate: 1.0
