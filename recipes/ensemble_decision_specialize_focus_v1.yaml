name: ensemble_decision_specialize_focus_v1
version: "1.9.6"
created_at: "2026-11-03"
updated_at: "2026-11-05"
task_type: rlcd
domain: NLP
description: >
  Choice-focus — PARKED. Gates cleared by v8 c7b78b5d (A/B 68/74) +
  Ensemble remap_decision_skill (hermetic 167/167). Do not dispatch for
  more miss-upweight (v7/v9 plateaued or regressed). Cases pin v8 (winning
  mix); v9.jsonl is archival only. Product :8082 is already this adapter
  (c7b78b5d + decision_prompt; bf94 = rollback). Empty-rationale stage 1.
  See Ensemble finetune/data/decision/README.md.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/decision.md
  no_adapter: false
  # Cleared side candidate (do not warm-start past this for focus churn).
  adapter: adapters/astra_c7b78b5d_iter0/best
  # Winning mix — not v9 (disk-upweight discarded).
  cases: data/decision/ensemble/specialize_choice_focus_v8.jsonl
  routing_only: false
  stage: "1"
  empty_rationale: true
  score: brier
  num_generations: 1
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  eval_max_cases: 250
  sf_coef: 0.3
  kl_beta: 0.04
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0
  iters: 180
  learning_rate: 0.0000015
  max_grad_norm: 1.0
  steps_per_eval: 25
  steps_per_report: 1
  save_every: 25
  max_seq_len: 4096

# Held-out readout is contaminated by focus JSONL overlap — not a promote gate.
# Target near warm-start so accidental dispatch does not pivot-spin (2235f69e).
target_metric:
  pass_rate: 0.58

metric_ceiling:
  pass_rate: 0.60
