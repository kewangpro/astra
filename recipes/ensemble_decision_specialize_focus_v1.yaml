name: ensemble_decision_specialize_focus_v1
version: "1.2.0"
created_at: "2026-11-03"
updated_at: "2026-11-03"
task_type: rlcd
domain: NLP
description: >
  Choice-heavy specialize focus after 407140f2. Warm-start from that best/.
  Cases: specialize_choice_focus_v2.jsonl (General Chat / System Admin /
  Data Services upweighted after routing A/B misses). Empty-rationale stage 1.
  Do not promote to :8082 until routing Choice A/B under decision_prompt beats
  or matches bf94ca32; keep conductor_min + bf94ca32 live until then.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/decision.md
  no_adapter: false
  # Focus mission 407140f2 (held-out 0.848; routing A/B 44/74 vs bf94 60/74).
  adapter: adapters/astra_407140f2_iter0/best
  cases: data/decision/ensemble/specialize_choice_focus_v2.jsonl
  routing_only: false
  stage: "1"
  empty_rationale: true
  score: brier
  num_generations: 1
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  eval_max_cases: 200
  sf_coef: 0.3
  kl_beta: 0.04
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0
  iters: 180
  learning_rate: 0.0000015
  max_grad_norm: 1.0
  steps_per_eval: 25
  steps_per_report: 1
  save_every: 25
  max_seq_len: 4096

target_metric:
  # Beat prior focus held-out (0.848) on GC-upweighted mix; real gate is routing A/B.
  pass_rate: 0.85

metric_ceiling:
  pass_rate: 1.0
