name: sft_llama_lora_v1
version: "1.0.0"
created_at: "2026-06-14"
task_type: SFT
domain: NLP
description: "Standard QLoRA fine-tuning recipe for Llama-3 class models with held-out validation and reasoning traces."

hyperparameters:
  base_model: meta-llama/Llama-3.1-8B
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  dataset_path: data/datasets/train.jsonl
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  batch_size: 4
  learning_rate: 0.0002
  num_epochs: 3
  save_steps: 200
  eval_steps: 50
  val_split: 0.1
  max_seq_length: 4096
  preserve_reasoning: true

target_metric:
  eval_loss: 1.2

