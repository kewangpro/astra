task_type: rerank
domain: NLP
description: >
  Phase 6b domain CrossEncoder reranker: ms-marco-MiniLM-L-6-v2 on
  skill/eval query–document pairs (finetune/prepare_rerank_data.py).
  Runs LOCALLY via SubprocessSandbox (not Mini MLX). Promote to
