name: ensemble_dpo_astratune_smoke
version: "1.0.0"
created_at: "2026-11-14"
task_type: dpo
learner_id: mlx_dpo
domain: NLP
description: >
  Short AstraTune DPO smoke: reuse pre-collected pairs (skip collection) for
  one epoch to verify astratune.make("mlx_dpo", use_execv=True) → dpo_train.py
  on Mini without heal loops.

hyperparameters:
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  astra_pkg_root: /Users/kewang/astra-pkg
  adapter: adapters/grpo_v9_min/best
  prompt_template: backend/prompts/conductor_min.md
  num_layers: 8
  lora_rank: 8
  lora_scale: 20.0
  lora_dropout: 0.0
  k_collect: 8
  temp: 1.2
  max_tokens: 96
  email_weight: 1
  routing_only: true
  load_pairs: logs/astra_9e7cc2df_pairs.jsonl
  epochs: 1
  beta: 0.1
  learning_rate: 3.0e-7
  max_grad_norm: 1.0
  steps_per_eval: 15
  eval_max_tokens: 256

metric_ceiling:
  pass_rate: 0.93
