name: ensemble_sft_specialist_secretary_v1
version: "1.0.0"
created_at: "2026-10-22"
task_type: sft
domain: NLP
description: >
  Phase 5 Secretary specialist SFT: gemma-3-4b-it-4bit on Email/Calendar
  tool-call trajectories. Dataset from prepare_specialist_data.py (demos +
  eval_cases.yaml bootstrap) → data_ft/specialists/secretary (~22/5).
  Cold-start LoRA twin of ensemble_sft_specialist_ds_v1. Sync JSONL to Mini
  finetune/data_ft/specialists/secretary before dispatch.
  HARVEST (2026-10-22): mission bf03b01e → eval_loss 0.13;
  adapters/astra_bf03b01e_iter0/best (= adapters/specialist_secretary_v1).

hyperparameters:
  base_model: mlx-community/gemma-3-4b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  dataset_path: data_ft/specialists/secretary

  # Cold start — no adapter warm-start
  adapter: ""

  num_layers: 8
  lora_rank: 16
  lora_scale: 20.0
  lora_dropout: 0.0
  batch_size: 1
  learning_rate: 0.00005
  iters: 150
  save_every: 50
  steps_per_eval: 50
  steps_per_report: 10
  val_split: 0.15
  val_batches: 5
  max_seq_length: 2560
  preserve_reasoning: true
  mask_prompt: true

target_metric:
  eval_loss: 0.55
