name: agent_gym_ppo_v1
version: "1.0.0"
created_at: "2026-09-17"
task_type: RL
domain: AgentGym
env_id: MultiTurnAgentGym-v0
description: >
  PPO reinforcement learning recipe for MultiTurnAgentGym-v0.
  Trains policies to solve multi-turn interactive tool-use scenarios (data retrieval,
  knowledge base lookup, calculations, and notifications) using 32D dialogue state feature
  observations and dense/sparse reward shaping.

target_metric:
  task_success: 0.85

metric_ceiling:
  task_success: 1.0

hyperparameters:
  learning_rate: 0.0003
  lr_schedule: linear
  gamma: 0.99
  gae_lambda: 0.95
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    net_arch: [256, 256]
  total_timesteps: 500000
  telemetry_interval: 512
  eval_episodes: 20

env_kwargs:
  max_steps: 8
  turn_penalty: 0.05
  step_reward: 0.5
  completion_reward: 2.0
  invalid_penalty: 0.2
