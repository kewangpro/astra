name: ensemble_rft_focus_v3
version: "1.0.0"
created_at: "2026-10-16"
task_type: rft
domain: NLP
description: >
  Third focused RFT pass. Warm-starts the verified harvest
  adapters/astra_6f4204c7_iter1/best (independent bare_eval 51/54) under
  conductor_min.md and trains on the 3 remaining model-routed misses.

  Source fail list:
    route_shell_git_status                         → System Admin
    route_travel_round_trip_two_tasks              → Travel Planning
    route_travel_single_delegation_passes_through  → Travel Planning

hyperparameters:
  base_model: mlx-community/gemma-3-4b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python

  no_adapter: false
  adapter: adapters/astra_6f4204c7_iter1/best

  prompt_template: backend/prompts/conductor_min.md
  routing_only: true

  focus_cases:
    - route_shell_git_status
    - route_travel_round_trip_two_tasks
    - route_travel_single_delegation_passes_through

  k_samples: 12
  temp: 0.8
  max_tokens: 256

  num_layers: 8
  lora_rank: 8
  lora_scale: 20.0
  lora_dropout: 0.0

  max_seq_len: 6144
  iters: 100
  batch_size: 1
  learning_rate: 0.00001
  steps_per_eval: 10
  save_every: 10
  mask_prompt: true
  eval_max_tokens: 256

# 52/54 = 0.96296…, which rounds to 0.963 under the pass_rate comparator.
# Reliability floor for 3 focus cases is max(3, 3//2) = 3.
target_metric:
  pass_rate: 0.963

metric_ceiling:
  pass_rate: 0.98
