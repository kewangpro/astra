name: minatar_asterix_dqn_v1
domain: minatar_asterix
task_type: rl
trainer_type: sb3
algorithm: DQN
version: 1.0.0
description: "DQN for MinAtar Asterix (10x10 gold collection vs side-spawning enemies, original n/l/u/r/d/f actions)."

env_id: MinAtar-Asterix-v0
target_metric:
  score: 12.0

hyperparameters:
  learning_rate: 0.00025
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 32
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.15
  exploration_initial_eps: 1.0
  exploration_final_eps: 0.02
  total_timesteps: 300000

metric_ceiling: 80.0
