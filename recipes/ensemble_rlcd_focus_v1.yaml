name: ensemble_rlcd_focus_v1
version: "1.2.0"
created_at: "2026-10-31"
task_type: rlcd
domain: NLP
description: >
  Empty-rationale RLCD focus on remaining live Choice misses after
  7832479a (165/167): route_programming_automate + route_report_kpi_dashboard,
  plus the prior 15 99b91b5a ids to prevent regression. Stage 1 only.
  Warm-start from astra_46624d8c_iter0/best.
hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/conductor_min.md
  no_adapter: false
  adapter: adapters/astra_46624d8c_iter0/best
  stage: "1"
  empty_rationale: true
  score: brier
  num_generations: 1
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  sf_coef: 0.3
  kl_beta: 0.04
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0
  iters: 120
  learning_rate: 0.000002
  max_grad_norm: 1.0
  steps_per_eval: 20
  steps_per_report: 1
  save_every: 20
  max_seq_len: 4096
  routing_only: true
  focus_weight: 15
  focus_cases:
    - route_programming_automate
    - route_report_kpi_dashboard
    - route_llm_data_analysis
    - route_shell_git_status
    - route_shell_ls_directory
    - route_shell_grep
    - route_programming_run_code
    - route_csv_data_services_with_file
    - route_cost_chart_to_business_reporting
    - route_secretary_send_confirmation
    - route_data_query_dataset
    - route_data_calculate_stats
    - route_calendar_schedule_meeting
    - route_calendar_check_availability
    - route_calendar_move_event
    - route_shell_tail_log
    - route_shell_find_large_files
target_metric:
  pass_rate: 0.92
metric_ceiling:
  pass_rate: 1.0
