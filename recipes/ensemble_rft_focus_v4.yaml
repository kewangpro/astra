name: ensemble_rft_focus_v4
version: "1.0.0"
created_at: "2026-10-16"
task_type: rft
domain: NLP
description: >
  Fourth focused RFT pass. Warm-starts the verified harvest
  adapters/astra_8ef08e64_iter0/best (independent bare_eval 52/54) under
  conductor_min.md and trains on the 2 model-routed regressions.

  Versus 6f4204c7 iter1 (51/54), 8ef08e64 fixed route_shell_git_status,
  route_travel_round_trip_two_tasks, and
  route_travel_single_delegation_passes_through, and regressed:
    validate_rule8b_lone_schedule_mission_ticker  → Market Analysis
    validate_rule11b_email_depends_on_ma          → Market Analysis

hyperparameters:
  base_model: mlx-community/gemma-3-4b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python

  no_adapter: false
  adapter: adapters/astra_8ef08e64_iter0/best

  prompt_template: backend/prompts/conductor_min.md
  routing_only: true

  focus_cases:
    - validate_rule8b_lone_schedule_mission_ticker
    - validate_rule11b_email_depends_on_ma

  k_samples: 12
  temp: 0.8
  max_tokens: 256

  num_layers: 8
  lora_rank: 8
  lora_scale: 20.0
  lora_dropout: 0.0

  max_seq_len: 6144
  iters: 100
  batch_size: 1
  learning_rate: 0.00001
  steps_per_eval: 10
  save_every: 10
  mask_prompt: true
  eval_max_tokens: 256

# 54/54 = 1.0. The cold-start rft ceiling stays 0.96; this recipe's own
# ceiling is what mission create consults. Reliability floor for 2 focus
# cases is min(2, max(3, 1)) = 2, so both kept examples can chain.
target_metric:
  pass_rate: 1.0

metric_ceiling:
  pass_rate: 1.0
