name: ensemble_decision_specialize_v1
version: "1.1.1"
created_at: "2026-11-02"
updated_at: "2026-11-04"
task_type: rlcd
domain: NLP
description: >
  Ensemble specialize after decision foundation continue. Warm-start from
  astra_70791e17_iter4/best (continue plateau best). Cases from
  specialize.jsonl (Choice routing + cascade/grounding Noul + Score).
  Empty-rationale stage 1, decision_prompt. Historical step in the cleared
  lineage (focus v8 c7b78 + remap → hermetic 167/167). Prefer specialize_focus
  only if replaying; do not promote specialize alone. Product :8082 stays
  bf94ca32 + conductor_min until an explicit swap.

hyperparameters:
  base_model: mlx-community/gemma-3-1b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  prompt_template: backend/prompts/decision.md
  no_adapter: false
  # Continue mission 70791e17 best (prior cold foundation: astra_4e08d667_iter0/best).
  adapter: adapters/astra_70791e17_iter4/best
  # Relative to finetune_dir after chdir (Mini flat tree).
  cases: data/decision/ensemble/specialize.jsonl
  routing_only: false
  stage: "1"
  empty_rationale: true
  score: brier
  num_generations: 1
  temp: 1.0
  max_tokens: 256
  eval_max_tokens: 256
  eval_max_cases: 200
  sf_coef: 0.3
  kl_beta: 0.04
  num_layers: 8
  lora_rank: 16
  lora_scale: 4.0
  lora_dropout: 0.0
  iters: 120
  learning_rate: 0.000002
  max_grad_norm: 1.0
  steps_per_eval: 20
  steps_per_report: 1
  save_every: 20
  max_seq_len: 4096

target_metric:
  # Beat prior specialize held-out floor; raise after routing A/B vs bf94 clears.
  pass_rate: 0.7

metric_ceiling:
  pass_rate: 1.0
