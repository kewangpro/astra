name: agent_gym_agrpo_v1
version: "1.0.0"
created_at: "2026-11-05"
task_type: agrpo
domain: AgentGym
description: >
  Agent GRPO (multi-turn tool trajectory RL) on MultiTurnAgentGym text observations.
  Wraps ensemble/finetune/agent_grpo_train.py with reward_mode=agent_gym. Runs on the
  Mac Mini via SSH like other fine-tune-remote workers. Pass rate is AgentGym
  task_success over the 8 scenarios — not Ensemble routing hermetic suite.

target_metric:
  pass_rate: 0.50

metric_ceiling:
  pass_rate: 1.0

hyperparameters:
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  adapter: ""
  no_adapter: true
  num_layers: 8
  lora_rank: 8
  lora_scale: 20.0
  lora_dropout: 0.0
  iters: 50
  num_generations: 2
  temp: 1.0
  max_tokens: 64
  max_turns: 8
  tool_failure_prob: 0.0
  reward_mode: agent_gym
  e2e_cases: ""
  learning_rate: 0.000001
  clip_epsilon: 0.1
  max_grad_norm: 1.0
  steps_per_report: 1
  steps_per_eval: 10
  save_every: 25
