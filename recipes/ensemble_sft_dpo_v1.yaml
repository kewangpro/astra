name: ensemble_sft_dpo_v1
version: "1.0.0"
created_at: "2026-09-12"
task_type: dpo
domain: NLP
description: >
  DPO (Direct Preference Optimization) preference tuning chained from the SFT adapter
  (adapters/astra_da8b82bb_iter0/best). Trains on Mac Mini via MLX on Apple Silicon GPU.

hyperparameters:
  base_model: mlx-community/gemma-3-12b-it-4bit
  finetune_dir: /Users/kewang/finetune
  python_bin: /Users/kewang/finetune-env/bin/python
  adapter: adapters/astra_da8b82bb_iter0/best
  prompt_template: backend/prompts/conductor_min.md
  num_layers: 16
  lora_rank: 16
  lora_scale: 32.0
  lora_dropout: 0.05
  load_pairs: logs/astra_9e7cc2df_pairs.jsonl
  k_collect: 2
  temp: 1.0
  max_tokens: 96
  email_weight: 1
  routing_only: true
  val_split: 0.15
  epochs: 1
  beta: 0.1
  learning_rate: 0.0000003
  max_grad_norm: 1.0
  steps_per_eval: 15
  eval_max_tokens: 256

metric_ceiling:
  pass_rate: 0.93

target_metric:
  pass_rate: 0.70
